<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Compliance as a virtual spring</title><desc id="desc">At equilibrium a 16 newton force and 800 newtons per metre stiffness give 20 millimetres of displacement. Doubling stiffness gives 10 millimetres. This is a virtual spring metaphor, not an extra mechanical component.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f74"/></marker></defs><rect width="1200" height="560" rx="20" fill="#f4f7f3"/><g font-family="system-ui,Arial,sans-serif"><text x="46" y="52" font-size="30" fill="#17372f" font-weight="700" text-anchor="start">PUSH. MEASURE. PREDICT.</text><text x="46" y="84" font-size="19" fill="#50665e" font-weight="400" text-anchor="start">Compliance control behaves like a virtual spring around the target.</text><text x="48" y="173" font-size="25" fill="#17372f" font-weight="700" text-anchor="start">K = 800 N/m</text><path d="M340 150 L340 215" stroke="#96aaa0" stroke-width="8" fill="none" /><path d="M340 184 L350 168 L360 200 L370 168 L380 200 L390 168 L400 200 L410 168 L420 200 L430 168 L440 200 L450 168 L460 200 L645 184" stroke="#087f74" stroke-width="3" fill="none" /><rect x="645" y="150" width="85" height="68" rx="8" fill="#cae4d8" stroke="#087f74" stroke-width="3"/><path d="M734 184 L830 184" stroke="#087f74" stroke-width="5" fill="none" marker-end="url(#arrow)"/><text x="910" y="172" font-size="24" fill="#17372f" font-weight="650" text-anchor="start">F = 16 N</text><text x="910" y="205" font-size="23" fill="#087f74" font-weight="400" text-anchor="start">x = 20 mm</text><text x="48" y="338" font-size="25" fill="#17372f" font-weight="700" text-anchor="start">K = 1600 N/m</text><path d="M340 315 L340 380" stroke="#96aaa0" stroke-width="8" fill="none" /><path d="M340 349 L350 333 L360 365 L370 333 L380 365 L390 333 L400 365 L410 333 L420 365 L430 333 L440 365 L450 333 L460 365 L570 349" stroke="#087f74" stroke-width="3" fill="none" /><rect x="570" y="315" width="85" height="68" rx="8" fill="#cae4d8" stroke="#087f74" stroke-width="3"/><path d="M659 349 L755 349" stroke="#087f74" stroke-width="5" fill="none" marker-end="url(#arrow)"/><text x="910" y="337" font-size="24" fill="#17372f" font-weight="650" text-anchor="start">F = 16 N</text><text x="910" y="370" font-size="23" fill="#087f74" font-weight="400" text-anchor="start">x = 10 mm</text><text x="48" y="499" font-size="24" fill="#17372f" font-weight="600" text-anchor="start">At settled equilibrium:  x = F / K     ·     Double stiffness → half the displacement</text></g></svg>