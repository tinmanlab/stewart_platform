<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Anatomy of the Stewart platform</title><desc id="desc">Six telescoping legs join a fixed base to a moving platform. Each leg has a ball joint at each end. Gold circles mark ball joints.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f74"/></marker></defs><rect width="1200" height="560" rx="20" fill="#f4f7f3"/><g font-family="system-ui,Arial,sans-serif"><text x="48" y="54" font-size="30" fill="#17372f" font-weight="700" text-anchor="start">SIX LEGS. SIX WAYS TO MOVE.</text><text x="48" y="85" font-size="18" fill="#50665e" font-weight="400" text-anchor="start">A 6-SPS parallel robot · schematic, not a fabrication drawing</text><ellipse cx="378" cy="445" rx="246" ry="73" fill="#dbe5dc"/><ellipse cx="378" cy="429" rx="233" ry="64" fill="#cbd9d0" stroke="#77958a" stroke-width="2"/><path d="M311.3 362.9 L424.4 171.2" stroke="#708a85" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M311.3 362.9 L381.4 244.0" stroke="#087f74" stroke-width="21" fill="none" stroke-linecap="round"/><circle cx="311.3" cy="362.9" r="12" fill="#c58b22" stroke="white" stroke-width="2"/><path d="M233.5 375.4 L231.3 203.9" stroke="#708a85" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M233.5 375.4 L232.1 269.0" stroke="#087f74" stroke-width="21" fill="none" stroke-linecap="round"/><circle cx="233.5" cy="375.4" r="12" fill="#c58b22" stroke="white" stroke-width="2"/><path d="M589.3 407.5 L478.4 180.3" stroke="#708a85" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M589.3 407.5 L520.5 266.6" stroke="#087f74" stroke-width="21" fill="none" stroke-linecap="round"/><circle cx="589.3" cy="407.5" r="12" fill="#c58b22" stroke="white" stroke-width="2"/><path d="M589.3 432.5 L478.4 245.7" stroke="#708a85" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M589.3 432.5 L520.5 316.7" stroke="#087f74" stroke-width="21" fill="none" stroke-linecap="round"/><circle cx="589.3" cy="432.5" r="12" fill="#c58b22" stroke="white" stroke-width="2"/><path d="M233.5 464.6 L231.3 222.1" stroke="#708a85" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M233.5 464.6 L232.1 314.3" stroke="#087f74" stroke-width="21" fill="none" stroke-linecap="round"/><circle cx="233.5" cy="464.6" r="12" fill="#c58b22" stroke="white" stroke-width="2"/><path d="M311.3 477.1 L424.4 254.8" stroke="#708a85" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M311.3 477.1 L381.4 339.3" stroke="#087f74" stroke-width="21" fill="none" stroke-linecap="round"/><circle cx="311.3" cy="477.1" r="12" fill="#c58b22" stroke="white" stroke-width="2"/><ellipse cx="378" cy="218" rx="165" ry="51" fill="#91bab0" stroke="#35685d" stroke-width="3"/><ellipse cx="378" cy="202" rx="165" ry="51" fill="#d0e7de" stroke="#35685d" stroke-width="3"/><circle cx="478.4" cy="245.7" r="10" fill="#c58b22" stroke="white" stroke-width="2"/><circle cx="424.4" cy="254.8" r="10" fill="#c58b22" stroke="white" stroke-width="2"/><circle cx="231.3" cy="222.1" r="10" fill="#c58b22" stroke="white" stroke-width="2"/><circle cx="231.3" cy="203.9" r="10" fill="#c58b22" stroke="white" stroke-width="2"/><circle cx="424.4" cy="171.2" r="10" fill="#c58b22" stroke="white" stroke-width="2"/><circle cx="478.4" cy="180.3" r="10" fill="#c58b22" stroke="white" stroke-width="2"/><path d="M329 169 L377 154 L428 169 L428 199 L378 214 L329 197 Z" fill="#d2a755" stroke="#88672d" stroke-width="2"/><text x="48" y="510" font-size="20" fill="#17372f" font-weight="600" text-anchor="start">S = ball joint     P = sliding joint     S = ball joint</text><path d="M673 178 L629 178 L525 205" stroke="#7c9488" stroke-width="2" fill="none" /><text x="695" y="184" font-size="23" fill="#17372f" font-weight="650" text-anchor="start">Moving platform + payload</text><text x="695" y="215" font-size="17" fill="#50665e" font-weight="400" text-anchor="start">Its pose has six degrees of freedom.</text><path d="M673 278 L629 278 L496 328" stroke="#7c9488" stroke-width="2" fill="none" /><text x="695" y="284" font-size="23" fill="#17372f" font-weight="650" text-anchor="start">Six telescoping actuators</text><text x="695" y="315" font-size="17" fill="#50665e" font-weight="400" text-anchor="start">Length changes push and pull the table.</text><path d="M673 381 L629 381 L563 403" stroke="#7c9488" stroke-width="2" fill="none" /><text x="695" y="387" font-size="23" fill="#17372f" font-weight="650" text-anchor="start">Ball joints at both ends</text><text x="695" y="418" font-size="17" fill="#50665e" font-weight="400" text-anchor="start">They let each leg change its direction.</text><text x="695" y="468" font-size="20" fill="#087f74" font-weight="600" text-anchor="start">Active = motor effort</text><text x="695" y="499" font-size="20" fill="#50665e" font-weight="400" text-anchor="start">Passive = optional spring + damper</text></g></svg>