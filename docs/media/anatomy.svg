<text x="692" y="319" font-size="17" fill="#536d72" font-weight="400">A sliding joint changes leg length.</text>
<text x="692" y="366" font-size="21" fill="#08796e" font-weight="700">S / Spherical</text>
<text x="692" y="396" font-size="17" fill="#536d72" font-weight="400">A second ball joint connects the table.</text>
