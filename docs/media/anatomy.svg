<text x="252" y="159" font-size="18" fill="#183b44" font-weight="700">Moving table</text>
<path d="M650 114 V500" stroke="#c9dad5"/>
<text x="692" y="151" font-size="25" fill="#183b44" font-weight="700">S — P — S, repeated six times</text>
<text x="692" y="212" font-size="21" fill="#08796e" font-weight="700">S / Spherical</text>
<text x="692" y="242" font-size="17" fill="#536d72" font-weight="400">A ball joint changes leg direction.</text>
