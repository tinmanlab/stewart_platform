<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Six-SPS Stewart platform: geometry and control</title>
<desc id="desc">Six legs connect paired anchors on a fixed base and a moving table. Teal sliders are active in the reference setup; amber ball joints are passive. A target passes through inverse kinematics and force control into physical motion. Geometry is projected from the simulator default anchor coordinates; schematic, not a manufacturing drawing.</desc>
