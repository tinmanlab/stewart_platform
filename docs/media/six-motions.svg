<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 548" role="img" aria-labelledby="title desc"><title id="title">Six degrees of freedom</title><desc id="desc">X Y and Z are translations. Roll pitch and yaw are rotations. Arrows are schematic and each motion is shown separately.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f74"/></marker></defs><rect width="1200" height="548" rx="20" fill="#f4f7f3"/><g font-family="system-ui,Arial,sans-serif"><text x="42" y="51" font-size="29" fill="#17372f" font-weight="700" text-anchor="start">THREE SLIDES + THREE TURNS</text><rect x="40" y="84" width="365" height="207" rx="14" fill="white" stroke="#d7e2da"/><text x="62" y="119" font-size="24" fill="#17372f" font-weight="700" text-anchor="start">X</text><path d="M159 195 l64 -23 l65 23 l-64 24 Z" fill="#d0e7de" stroke="#087f74" stroke-width="2"/><path d="M140 179 L320 179" stroke="#087f74" stroke-width="4" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="222" y="270" font-size="18" fill="#50665e" font-weight="400" text-anchor="middle">Slide sideways</text><rect x="425" y="84" width="365" height="207" rx="14" fill="white" stroke="#d7e2da"/><text x="447" y="119" font-size="24" fill="#17372f" font-weight="700" text-anchor="start">Y</text><path d="M544 195 l64 -23 l65 23 l-64 24 Z" fill="#d0e7de" stroke="#087f74" stroke-width="2"/><path d="M566 226 L661 147" stroke="#087f74" stroke-width="4" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="607" y="270" font-size="18" fill="#50665e" font-weight="400" text-anchor="middle">Slide forward / back</text><rect x="810" y="84" width="365" height="207" rx="14" fill="white" stroke="#d7e2da"/><text x="832" y="119" font-size="24" fill="#17372f" font-weight="700" text-anchor="start">Z</text><path d="M929 195 l64 -23 l65 23 l-64 24 Z" fill="#d0e7de" stroke="#087f74" stroke-width="2"/><path d="M995 236 L995 149" stroke="#087f74" stroke-width="4" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="992" y="270" font-size="18" fill="#50665e" font-weight="400" text-anchor="middle">Lift / lower</text><rect x="40" y="308" width="365" height="207" rx="14" fill="white" stroke="#d7e2da"/><text x="62" y="343" font-size="24" fill="#17372f" font-weight="700" text-anchor="start">Roll</text><path d="M159 419 l64 -23 l65 23 l-64 24 Z" fill="#d0e7de" stroke="#087f74" stroke-width="2"/><path d="M206 384 C300 343 312 473 209 452" stroke="#087f74" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="222" y="494" font-size="18" fill="#50665e" font-weight="400" text-anchor="middle">Tip about X</text><rect x="425" y="308" width="365" height="207" rx="14" fill="white" stroke="#d7e2da"/><text x="447" y="343" font-size="24" fill="#17372f" font-weight="700" text-anchor="start">Pitch</text><path d="M544 419 l64 -23 l65 23 l-64 24 Z" fill="#d0e7de" stroke="#087f74" stroke-width="2"/><path d="M581 454 C515 398 634 347 649 412" stroke="#087f74" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="607" y="494" font-size="18" fill="#50665e" font-weight="400" text-anchor="middle">Tip about Y</text><rect x="810" y="308" width="365" height="207" rx="14" fill="white" stroke="#d7e2da"/><text x="832" y="343" font-size="24" fill="#17372f" font-weight="700" text-anchor="start">Yaw</text><path d="M929 419 l64 -23 l65 23 l-64 24 Z" fill="#d0e7de" stroke="#087f74" stroke-width="2"/><path d="M932 453 C817 357 1148 347 1086 444" stroke="#087f74" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="992" y="494" font-size="18" fill="#50665e" font-weight="400" text-anchor="middle">Turn about Z</text></g></svg>