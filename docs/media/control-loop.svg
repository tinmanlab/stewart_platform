<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">Control and simulation loop</title><desc id="desc">Targets enter the controller, then force allocation and rigid-body dynamics. Measured pose and velocity feed back to the controller. External forces and passive joints act on the dynamics.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f74"/></marker></defs><rect width="1200" height="510" rx="20" fill="#f4f7f3"/><g font-family="system-ui,Arial,sans-serif"><text x="42" y="51" font-size="29" fill="#17372f" font-weight="700" text-anchor="start">FROM A TARGET TO A PHYSICAL RESPONSE</text><rect x="40" y="137" width="250" height="103" rx="14" fill="white" stroke="#639486" stroke-width="2"/><text x="165" y="177" font-size="23" fill="#17372f" font-weight="650" text-anchor="middle">Target</text><text x="165" y="211" font-size="16" fill="#50665e" font-weight="400" text-anchor="middle">Pose or leg length</text><path d="M292 188 L320 188" stroke="#087f74" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="326" y="137" width="250" height="103" rx="14" fill="white" stroke="#639486" stroke-width="2"/><text x="451" y="177" font-size="23" fill="#17372f" font-weight="650" text-anchor="middle">Controller</text><text x="451" y="211" font-size="16" fill="#50665e" font-weight="400" text-anchor="middle">PD / gravity / impedance</text><path d="M578 188 L606 188" stroke="#087f74" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="612" y="137" width="250" height="103" rx="14" fill="white" stroke="#639486" stroke-width="2"/><text x="737" y="177" font-size="23" fill="#17372f" font-weight="650" text-anchor="middle">Effort allocation</text><text x="737" y="211" font-size="16" fill="#50665e" font-weight="400" text-anchor="middle">Active joints + limits</text><path d="M864 188 L892 188" stroke="#087f74" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="898" y="137" width="250" height="103" rx="14" fill="white" stroke="#639486" stroke-width="2"/><text x="1023" y="177" font-size="23" fill="#17372f" font-weight="650" text-anchor="middle">Dynamics</text><text x="1023" y="211" font-size="16" fill="#50665e" font-weight="400" text-anchor="middle">Mass, gravity, velocity</text><path d="M1024 242 L1024 342 L451 342 L451 242" stroke="#087f74" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="740" y="378" font-size="22" fill="#17372f" font-weight="400" text-anchor="middle">Measured pose + velocity → feedback</text><text x="1025" y="96" font-size="17" fill="#50665e" font-weight="400" text-anchor="middle">External load + passive joints</text><path d="M1024 104 L1024 132" stroke="#087f74" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="44" y="438" font-size="23" fill="#17372f" font-weight="600" text-anchor="start">The renderer observes the state. It never teleports the platform to the target.</text><text x="44" y="475" font-size="18" fill="#50665e" font-weight="400" text-anchor="start">A requested motion can fail: saturation, insufficient active joints or unreachable geometry remain visible.</text></g></svg>