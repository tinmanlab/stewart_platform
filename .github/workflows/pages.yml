name: Test and publish
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install development tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Check numerical model and English release
        run: |
          for file in src/*.js; do node --check "$file"; done
          node tests/core.test.cjs
          node tests/endurance.test.cjs
          node tests/ball.test.cjs
          node tests/ball_invalid.test.cjs
          node examples/compliance.cjs
          python tests/english.test.py
          python build.py
      - name: Exercise real browser controls
        run: |
          python tests/browser_smoke.py
          python tests/experience.test.py
          python tests/ball_browser.py --serve
      - name: Produce captioned demonstrations
        run: |
          python tools/record_demos.py
          python tools/build_preview.py
      - name: Build and check the educational website
        run: |
          python build.py --site
          python tests/site.test.py
          python tests/site_hardening.test.py
          python tests/hosted_smoke.py
      - name: Preserve exact development source
        run: |
          mkdir -p artifacts
          git archive --format=zip --prefix=stewart_platform/ --output=artifacts/development-source.zip HEAD
          git rev-parse HEAD > artifacts/development-source-commit.txt
          python -m zipfile --test artifacts/development-source.zip
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ github.sha }}
          path: |
            artifacts/
            tests/*-results.json
            site/build.json
          if-no-files-found: warn
          retention-days: 14
      - name: Package the verified site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install browser verification tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Verify public Pages and GitHub README
        run: |
          python tests/hosted_smoke.py --base-url https://tinmanlab.github.io/stewart_platform/ --expected-commit "$GITHUB_SHA" --readme
          python tests/ball_browser.py --url https://tinmanlab.github.io/stewart_platform/
      - name: Preserve hosted verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
