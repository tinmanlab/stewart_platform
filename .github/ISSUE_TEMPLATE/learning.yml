name: Learning question or example
description: Ask about a concept or suggest a small teaching experiment.
title: "[Learning] "
body:
  - type: textarea
    id: question
    attributes:
      label: What would you like to understand?
      description: Point to a control, equation, page or experiment. No prior expertise required.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried or predicted?
